spring:
  datasource:
    url: jdbc:mysql://localhost:3306/testdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      format_sql: true
      dialect: org.hibernate.dialect.MySQLDialect
    jdbc:
      time_zone: Asia/Seoul
    show_sql: true
  data:
    redis:
      ssl:
        enabled: true
      cluster:
        nodes: ${redis.host:localhost:6379}
        max-redirects: 3


management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret:

slack:
  api:
    bot-token: ${slack.token:1234}
    log-channel: ${slack.channel:1234}